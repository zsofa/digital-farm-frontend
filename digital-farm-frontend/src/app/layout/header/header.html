<header class="header">
  <div class="brand">
    <div class="brand-mark">
      DF
    </div>

    <span class="brand-name">
      Digital Farm
    </span>
  </div>

  <div class="header-center">
    @if (farms().length > 0) {
      <div class="farm-selector">
        <span class="farm-selector-label">
          Active farm
        </span>

        <select
          [value]="selectedFarm()?.id ?? ''"
          (change)="selectFarm($event)"
        >
          @for (farm of farms(); track farm.id) {
            <option [value]="farm.id">
              {{ farm.name }}
            </option>
          }
        </select>
      </div>
    }
  </div>

  <div class="header-actions">
    @if (currentUser(); as user) {
      <div class="user-info">
        <div class="user-text">
          <span class="user-name">
            {{ user.first_name }} {{ user.last_name }}
          </span>

          <span class="user-email">
            {{ user.email }}
          </span>
        </div>

        <div class="avatar">
          {{ initials }}
        </div>
      </div>

      <button
        type="button"
        class="logout-button"
        (click)="logout()"
      >
        Log out
      </button>
    }
  </div>
</header>
